<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
*{box-sizing:border-box;margin:0;padding:0}
.cx{font-family:"Instrument Sans",-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;width:390px;min-height:100%;background:var(--page);color:var(--txt);position:relative;overflow:hidden}
.cx-dark{--page:#151918;--surface:#202624;--surface-2:#282F2D;--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.17);--txt:#F1F4EF;--txt-strong:#FFFFFF;--txt-sub:#BDC8C2;--txt-dim:#8C9993;--txt-faint:#69766F;--accent:#77C8AD;--accent-strong:#58AF92;--accent-soft:rgba(119,200,173,.13);--on-accent:#10251E}
.cx-light{--page:#F3F2ED;--surface:#FFFEFA;--surface-2:#EEEEE8;--line:rgba(22,27,29,.09);--line-strong:rgba(22,27,29,.16);--txt:#202629;--txt-strong:#111719;--txt-sub:#596366;--txt-dim:#858E90;--txt-faint:#AAB1B0;--accent:#287D6B;--accent-strong:#176454;--accent-soft:rgba(40,125,107,.11);--on-accent:#FFFFFF}
.cx::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0}
.cx-dark::before{background:radial-gradient(60% 40% at 12% -5%,rgba(119,200,173,.12),transparent 62%)}
.cx-light::before{background:radial-gradient(60% 40% at 12% -5%,rgba(40,125,107,.10),transparent 62%)}
.pad{position:relative;z-index:1;padding:22px 18px 26px}
svg{display:block}
.icon-btn{width:40px;height:40px;border-radius:12px;border:none;background:var(--surface-2);color:var(--txt-sub);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.vh-top{display:flex;align-items:center;gap:13px;margin-bottom:18px}
.vh-h2{font-family:"Sora",sans-serif;font-size:22px;font-weight:700;letter-spacing:-.03em;color:var(--txt-strong)}
.vault-hero{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);margin-bottom:16px}
.vault-hero-ic{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.vault-hero strong{font-size:14px;font-weight:700;color:var(--txt-strong);letter-spacing:-.01em}
.vault-group{display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.vault-group .art{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.vault-group strong{display:block;font-size:14.5px;font-weight:700;color:var(--txt-strong);letter-spacing:-.012em}
.vault-group small{display:block;font-size:12px;color:var(--txt-dim);margin-top:2px}
.vbtn{margin-left:auto;padding:8px 15px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--txt-sub);font-size:12px;font-weight:700;cursor:pointer}
.vault-clips{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.vclip{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.vclip:last-child{border-bottom:none}
.vclip .ic{width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;background:var(--surface-2);color:var(--txt-dim)}
.vclip-copy{flex:1;min-width:0}
.vclip-copy strong{display:block;font-size:14px;font-weight:700;color:var(--txt-strong);letter-spacing:2px}
.vclip-copy small{display:block;font-size:12px;color:var(--txt-dim);margin-top:3px}
.vview{padding:7px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;flex:0 0 auto}
a{color:var(--accent)}a:hover{color:var(--accent-strong)}
  </style>
</helmet>

<div class="cx {{themeClass}}">
  <div class="pad">

    <div class="vh-top">
      <button class="icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <div class="vh-h2">Vault</div>
    </div>

    <div class="vault-hero">
      <span class="vault-hero-ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4"/><path d="m18 5 2 2"/><path d="m15 8 2 2"/></svg></span>
      <strong>Protected by Cliplo</strong>
    </div>

    <div class="vault-group">
      <span class="art"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 21a8 8 0 0 0-16 0"/><circle cx="10" cy="8" r="5"/><path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3"/></svg></span>
      <div><strong>Google accounts</strong><small>7 protected clips</small></div>
      <button class="vbtn">View</button>
    </div>

    <div class="vault-clips">
      <div class="vclip">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg></span>
        <div class="vclip-copy"><strong>Card details</strong><small>Saved 2 days ago</small></div>
        <button class="vview">View</button>
      </div>
      <div class="vclip">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
        <div class="vclip-copy"><strong>Home address</strong><small>Saved 1 week ago</small></div>
        <button class="vview">View</button>
      </div>
      <div class="vclip">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4"/><path d="m18 5 2 2"/><path d="m15 8 2 2"/></svg></span>
        <div class="vclip-copy"><strong>• • • • • • • • • •</strong><small>Saved yesterday</small></div>
        <button class="vview">View</button>
      </div>
    </div>

  </div>
</div>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["Dark","Light"],"default":"Dark"}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.theme === 'Light' ? 'cx-light' : 'cx-dark' };
  }
}
</script>
</body>
</html>
