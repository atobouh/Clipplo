  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
  /* =========================================================
     DESIGN TOKENS - Cliplo mineral / ink / paper
     UI glyphs: lucide (2px stroke). Logos: mdi brand marks.
      Accent: mineral green, reserved for action and identity.
  ========================================================= */
  :root {
    /* surfaces */
    --page: #151918;
    --surface: #202624;
    --surface-2: #282F2D;
    --surface-3: #313A37;
    --line: rgba(255,255,255,.10);
    --line-strong: rgba(255,255,255,.17);
    --hi: rgba(255,255,255,.05);
    --elev: 0 1px 0 var(--hi) inset, 0 18px 42px -22px rgba(0,0,0,.5);
    --elev-raise: 0 1px 0 rgba(255,255,255,.06) inset, 0 28px 60px -24px rgba(0,0,0,.7);
    /* text */
    --txt: #F1F4EF;
    --txt-strong: #FFFFFF;
    --txt-sub: #BDC8C2;
    --txt-dim: #8C9993;
    --txt-faint: #69766F;
    --accent: #77C8AD;
    --accent-strong: #58AF92;
    --accent-deep: #3F9276;
    --accent-soft: rgba(119,200,173,.13);
    --accent-glow: rgba(88,175,146,.30);
    --on-accent: #10251E;
    --kb-page: #151918;
    --kb-surface: #202624;
    --kb-raised: #282F2D;
    --kb-key: #313A37;
    --kb-outline: rgba(255,255,255,.14);
    /* semantic */
    --rose: #EF8B8A;
    --rose-soft: rgba(239,139,138,.12);
    --rose-glow: rgba(239,139,138,.28);
    /* metrics */
    --r-lg: 22px;
    --r-md: 16px;
    --r-sm: 13px;
    --r-pill: 999px;
    --tnum: "tnum" 1, "cv11" 1, "ss01" 1;
    /* motion Ã¢â‚¬â€ one ease reused everywhere */
    --ease: cubic-bezier(.22,.61,.36,1);
    --ease-out: cubic-bezier(.16,1,.3,1);
  }
  [data-theme="light"] {
    --page: #F3F2ED;
    --surface: #FFFEFA;
    --surface-2: #EEEEE8;
    --surface-3: #E3E3DB;
    --line: rgba(22,27,29,.09);
    --line-strong: rgba(22,27,29,.16);
    --hi: rgba(255,255,255,.95);
    --elev: 0 1px 0 var(--hi) inset, 0 14px 32px -22px rgba(20,29,29,.25), 0 3px 8px -5px rgba(20,29,29,.1);
    --elev-raise: 0 1px 0 var(--hi) inset, 0 24px 52px -25px rgba(20,29,29,.28), 0 6px 14px -6px rgba(20,29,29,.1);
    --txt: #202629;
    --txt-strong: #111719;
    --txt-sub: #596366;
    --txt-dim: #858E90;
    --txt-faint: #AAB1B0;
    --accent: #287D6B;
    --accent-strong: #176454;
    --accent-deep: #104C41;
    --accent-soft: rgba(40,125,107,.11);
    --accent-glow: rgba(40,125,107,.20);
    --on-accent: #FFFFFF;
    --kb-page: #F3F2ED;
    --kb-surface: #FFFEFA;
    --kb-raised: #EEEEE8;
    --kb-key: #E3E3DB;
    --kb-outline: rgba(22,27,29,.14);
    --rose: #CE5F5E;
    --rose-soft: rgba(206,95,94,.10);
    --rose-glow: rgba(206,95,94,.20);
  }

  * { box-sizing:border-box; margin:0; padding:0; }
  html { color-scheme: dark; }
  [data-theme="light"] { color-scheme: light; }

  body {
    font-family:"Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    font-feature-settings:"cv11","ss01","cv06";
    background: var(--page);
    color: var(--txt);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display:flex; justify-content:center;
    min-height:100vh;
    position:relative; overflow-x:hidden;
    caret-color: var(--accent);
    transition: background .35s var(--ease), color .35s var(--ease);
  }
  /* ambient bloom Ã¢â‚¬â€ the room the app is lit in */
  body::before {
    content:""; position:fixed; inset:-20% -10% -10% -10%; z-index:-1; pointer-events:none;
    background:
      radial-gradient(50% 32% at 18% -8%,  rgba(139,92,246,.12), transparent 70%),
      radial-gradient(40% 28% at 92% 108%, rgba(56, 82, 255,.06), transparent 68%);
    filter: none;
  }
  [data-theme="dark"] body::before {
    background:
      radial-gradient(60% 45% at 12% -5%, rgba(119,200,173,.12), transparent 62%),
      radial-gradient(55% 40% at 92% 100%, rgba(40,125,107,.10), transparent 60%);
    filter: none;
  }
  [data-theme="light"] body::before {
    background:
      radial-gradient(60% 45% at 12% -5%, rgba(40,125,107,.10), transparent 62%),
      radial-gradient(55% 40% at 92% 100%, rgba(119,200,173,.08), transparent 60%);
    filter:none;
  }

  /* browser surfaces Ã¢â‚¬â€ themed, not defaults */
  ::selection { background: var(--accent-glow); color: var(--txt-strong); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--surface-2);
    border: 2px solid transparent; background-clip: content-box;
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--surface-3); background-clip: content-box; }
  * { scrollbar-color: var(--surface-2) transparent; scrollbar-width: thin; }
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: inherit;
  }

  .app { width:100%; max-width:430px; padding:max(22px, env(safe-area-inset-top)) 18px calc(80px + env(safe-area-inset-bottom) + var(--keyboard-inset, 0px)); position:relative; z-index:1; }
  button, input, .chip, .clip, .mode-ic, .ph { -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  @media (pointer:coarse) {
    .copy, .icon-btn { width:44px; height:44px; }
    .detail-close { width:44px; height:44px; }
    .dact.peer { width:48px; min-width:48px; min-height:48px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  /* ---- topbar ---- */
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; }
  .brand { display:flex; align-items:center; gap:13px; }
  .brand-ic {
    width:36px; height:36px; border-radius:11px;
    background: var(--surface-2);
    display:grid; place-items:center; color:var(--txt-strong);
    position:relative;
  }
  .brand-ic::after { display:none; }
  .brand-txt h1 { font-size:20px; font-weight:700; letter-spacing:-.032em; line-height:1.1; color:var(--txt-strong); }
  .brand-title { position:relative; display:grid; width:max-content; min-width:4.25em; overflow:visible; transition:width .25s var(--ease-out); }
  .brand-title span { grid-area:1 / 1; display:block; white-space:nowrap; transition:opacity .25s var(--ease-out), transform .25s var(--ease-out); }
  .brand-title .brand-title-greeting { opacity:0; transform:translateY(3px); }
  .brand-title.is-greeting .brand-title-default { opacity:0; transform:translateY(-3px); }
  .brand-title.is-greeting .brand-title-greeting { opacity:1; transform:none; }
  .brand-txt small { display:block; font-size:12px; color:var(--txt-dim); font-weight:500; letter-spacing:-.005em; margin-top:2px; }
  .top-actions { display:flex; gap:10px; }
  .icon-btn {
    width:40px; height:40px; border-radius:12px; border:none;
    background: transparent;
    color:var(--txt-dim); cursor:pointer; display:grid; place-items:center;
    box-shadow:none;
    transition:transform .18s var(--ease), background .18s var(--ease), color .18s var(--ease);
  }
  .icon-btn:hover { transform:none; background:var(--surface-2); color:var(--txt-strong); }
  .icon-btn:active { transform:translateY(0) scale(.97); }
  .icon-btn .iconify { font-size:18px; }

  /* ---- Cliplo Keyboard prototype: calm retrieval surface ---- */
  .keyboard-screen { display:none; position:fixed; inset:0; z-index:160; background:var(--page); overflow:hidden; }
  .keyboard-screen.is-open { display:block; animation:keyboardReveal .32s var(--ease-out) both; }
  .keyboard-stage { width:min(100%,430px); height:100%; margin:0 auto; display:flex; flex-direction:column; }
  .keyboard-host { flex:1; min-height:92px; padding:18px 18px 12px; display:flex; flex-direction:column; justify-content:flex-end; background:var(--page); }
  .keyboard-host-context { display:flex; align-items:center; gap:8px; color:var(--txt-dim); font:600 11px "Instrument Sans",sans-serif; }
  .keyboard-host-context .iconify { color:var(--accent); font-size:14px; }
  .keyboard-composer { margin-top:12px; height:40px; border:1px solid var(--line); border-radius:13px; background:var(--surface); color:var(--txt-faint); display:flex; align-items:center; padding:0 12px; font:500 12px "Instrument Sans",sans-serif; }
  .keyboard-panel { position:relative; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--kb-outline); border-radius:24px 24px 0 0; background:var(--kb-surface); box-shadow:0 -18px 34px -26px rgba(0,0,0,.48); transition:padding .3s var(--ease-out),background .22s var(--ease); }
  .keyboard-panel::before { content:""; position:absolute; top:0; left:50%; width:28px; height:3px; border-radius:99px; background:var(--txt-faint); transform:translate(-50%,-7px); opacity:.45; }
  .keyboard-toolbar { display:flex; align-items:center; gap:9px; }
  .keyboard-mode-toggle { width:42px; height:42px; flex:0 0 auto; border:1px solid var(--kb-outline); border-radius:13px; background:var(--kb-raised); color:var(--accent); display:grid; place-items:center; cursor:pointer; box-shadow:0 1px 0 var(--hi) inset; transition:background .22s var(--ease),border-color .22s var(--ease),color .22s var(--ease),transform .22s var(--ease); }
  .keyboard-mode-toggle:hover, .keyboard-mode-toggle.is-active { color:var(--accent-strong); border-color:color-mix(in srgb,var(--accent) 60%,var(--kb-outline)); background:var(--accent-soft); }
  .keyboard-mode-toggle.is-active { transform:rotate(180deg); }
  .keyboard-search { flex:1; min-width:0; height:42px; border:1px solid var(--kb-outline); border-radius:13px; padding:0 13px; background:transparent; color:var(--txt-strong); font:500 13px/1 "Instrument Sans",sans-serif; letter-spacing:-.015em; outline:none; box-shadow:0 1px 0 var(--hi) inset; transition:flex-basis .3s var(--ease-out),width .3s var(--ease-out),padding .3s var(--ease-out),opacity .2s var(--ease),border-color .2s var(--ease),background .2s var(--ease); }
  .keyboard-search:focus { border-color:var(--accent); background:var(--kb-raised); box-shadow:0 0 0 3px var(--accent-soft); }
  .keyboard-search::placeholder { color:var(--txt-dim); }
  .keyboard-close { width:32px; height:42px; border:0; border-radius:12px; background:transparent; color:var(--txt-dim); display:grid; place-items:center; cursor:pointer; }
  .keyboard-close:hover { color:var(--txt-strong); background:var(--kb-raised); }
  .keyboard-collection-nav { max-height:0; margin:0 -2px; padding:0 4px; opacity:0; visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; overflow:hidden; pointer-events:none; touch-action:none; cursor:ns-resize; transition:max-height .34s var(--ease-out),margin .34s var(--ease-out),padding .34s var(--ease-out),opacity .22s var(--ease),visibility 0s linear .34s; }
  .keyboard-panel.is-collection-mode .keyboard-collection-nav { max-height:178px; margin:18px -2px 2px; padding:5px 4px; opacity:1; visibility:visible; pointer-events:auto; transform:translateY(18px); transition-delay:0s; }
  .keyboard-panel.is-collection-mode .keyboard-search { flex:0 0 0; width:0; min-width:0; padding-left:0; padding-right:0; border-color:transparent; opacity:0; pointer-events:none; }
  .keyboard-clips { display:block; height:60px; max-height:60px; opacity:1; overflow:hidden !important; scrollbar-width:none; transition:max-height .34s var(--ease-out),opacity .2s var(--ease),margin .34s var(--ease-out); }
  .keyboard-clips::-webkit-scrollbar { display:none; }
  .keyboard-clip-track { display:flex; flex-direction:column; gap:0; will-change:transform; transition:transform .3s cubic-bezier(.22,.75,.2,1); }
  .keyboard-panel.is-collection-mode .keyboard-clips { max-height:0; opacity:0; margin:0; overflow:hidden; pointer-events:none; }
  .keyboard-label { max-height:24px; margin:12px 2px 6px; color:var(--txt-faint); font:700 10px "Instrument Sans",sans-serif; letter-spacing:.13em; text-transform:uppercase; opacity:1; overflow:hidden; transition:max-height .34s var(--ease-out),opacity .2s var(--ease),margin .34s var(--ease-out); }
  .keyboard-panel.is-collection-mode .keyboard-label { max-height:0; opacity:0; margin:0; }
  .keyboard-collection-name { width:100%; min-height:34px; border:0; border-radius:999px; background:transparent; color:var(--txt-dim); font:600 14px "Sora",sans-serif; letter-spacing:-.035em; cursor:pointer; transition:opacity .22s var(--ease),color .22s var(--ease),transform .22s var(--ease),font-size .22s var(--ease),background .22s var(--ease),box-shadow .22s var(--ease); }
  .keyboard-collection-name[data-position="prev"], .keyboard-collection-name[data-position="next"] { opacity:.42; transform:scale(.92); }
  .keyboard-collection-name[data-position="current"] { min-height:44px; color:var(--txt-strong); font-size:18px; font-weight:700; letter-spacing:-.045em; background:var(--accent-soft); box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent) inset; }
  .keyboard-collection-name:hover { color:var(--accent); }
  .keyboard-collection-name:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .keyboard-collection-nav.is-shifting .keyboard-collection-name[data-position="current"] { animation:collectionTick .24s var(--ease-out) both; }
  @keyframes collectionTick { from { opacity:.25; transform:translateY(5px) scale(.92); } to { opacity:1; transform:none; } }
  .keyboard-clip { width:100%; height:58px; min-height:58px; flex:0 0 58px; display:grid; grid-template-columns:28px minmax(0,1fr) auto; align-items:center; gap:10px; padding:7px 4px; border:1px solid transparent; border-radius:12px; background:transparent; text-align:left; cursor:pointer; color:inherit; }
  .keyboard-clip { border-color:transparent; transition:background .24s var(--ease),box-shadow .24s var(--ease),transform .24s var(--ease); }
  .keyboard-clip:hover { background:color-mix(in srgb,var(--kb-raised) 42%,transparent); border-color:transparent; }
  .keyboard-clip:focus-visible { outline:none; background:var(--accent-soft); border-color:transparent; box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 28%,transparent) inset; }
  .keyboard-clip.is-active { background:color-mix(in srgb,var(--kb-raised) 58%,transparent); box-shadow:0 1px 0 var(--hi) inset,0 6px 18px -16px rgba(0,0,0,.45); }
  .keyboard-clip-mark { width:27px; height:27px; display:grid; place-items:center; border-radius:9px; background:var(--accent-soft); color:var(--accent); }
  .keyboard-clip:nth-child(2) .keyboard-clip-mark { background:rgba(229,182,129,.14); color:#DCA873; }
  .keyboard-clip:nth-child(3) .keyboard-clip-mark { background:rgba(113,133,184,.14); color:#8D9CC8; }
  .keyboard-clip-mark .iconify { font-size:14px; }
  .keyboard-clip-copy { min-width:0; }
  .keyboard-clip-copy strong, .keyboard-clip-copy small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .keyboard-clip-copy strong { color:var(--txt-strong); font-size:12px; line-height:1.35; font-weight:600; }
  .keyboard-clip-copy small { margin-top:3px; color:var(--txt-dim); font-size:10px; }
  .keyboard-paste { width:30px; height:30px; border:0; border-radius:10px; background:transparent; color:var(--txt-dim); display:grid; place-items:center; cursor:pointer; transition:background .18s var(--ease),color .18s var(--ease); }
  .keyboard-clip:hover .keyboard-paste, .keyboard-paste:focus-visible { background:var(--accent); color:var(--on-accent); }
  .keyboard-empty { display:none; padding:22px 8px 15px; text-align:center; color:var(--txt-dim); font:500 12px/1.4 "Instrument Sans",sans-serif; }
  .keyboard-empty.is-visible { display:block; }
  .keyboard-empty button { margin-top:8px; border:0; background:transparent; color:var(--accent); font:700 11px "Instrument Sans",sans-serif; cursor:pointer; }
  @keyframes keyboardReveal { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

  /* ---- mode / capture bar ---- */
  .capture {
    background: var(--surface-2);
    border: none;
    border-radius: 14px; margin-bottom:18px;
    box-shadow: none;
    overflow:hidden; position:relative;
    transition:box-shadow .28s var(--ease), background .22s var(--ease);
  }
  [data-theme="light"] .capture {
    background: #FFFFFF;
    border: 1px solid var(--line-strong);
  }
  .capture.open, .capture.flash {
    box-shadow:
      0 0 0 1px var(--accent-strong),
      0 0 0 5px var(--accent-soft),
      var(--elev-raise);
  }
  .capture-row { display:flex; align-items:center; gap:8px; padding:0 10px; min-height:44px; }
  .mode-ic {
    width:32px; height:32px; border-radius:10px; flex:0 0 auto;
    background: transparent;
    border: none;
    display:grid; place-items:center; color:var(--txt-sub);
    cursor:pointer;
    transition:transform .16s var(--ease), background .2s var(--ease), color .2s var(--ease);
  }
  .mode-ic morph-icon { display:block; line-height:0; }
  .mode-ic:hover { color: var(--txt-strong); background: rgba(255,255,255,.04); }
  .mode-ic:active { transform:scale(.92); }
  .hint { flex:1; min-width:0; }
  .hint input {
    width:100%; background:none; border:none; outline:none;
    color:var(--txt-strong); font-size:13.5px; font-weight:500;
    letter-spacing:-.008em; font-family:inherit;
    height:32px; line-height:32px; padding:0;
  }
  .hint input::placeholder { color:var(--txt-faint); }
  .ph {
    display:none; align-items:center; gap:5px; cursor:pointer;
    font-size:11.5px; font-weight:600; color:var(--txt-dim);
    border: none;
    padding:0 8px; border-radius:var(--r-pill);
    white-space:nowrap;
    background: transparent;
    height:32px;
    transition:color .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease);
  }
  .ph:hover { color:var(--txt-strong); background:var(--surface-2); border-color:var(--line-strong); }
  .ph .iconify { font-size:14px; }
  .ph.on {
    background: linear-gradient(180deg, var(--accent), var(--accent-strong));
    border-color: transparent; color: var(--on-accent);
    box-shadow: 0 1px 0 rgba(255,255,255,.22) inset;
  }
  .paste-hint { display:none; }
  .capture.mode-paste .paste-hint { display:flex; }
  .capture.mode-clipper .filter-ph { display:flex; }

  .capture-extra { display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s var(--ease-out); }
  .capture-extra > * { overflow:hidden; min-height:0; }
  .capture.open .capture-extra { grid-template-rows:1fr; }
  .extra-pad { padding:4px 15px 16px; border-top: none; }
  .group-label { font-size:10.5px; font-weight:700; color:var(--txt-faint); text-transform:uppercase; letter-spacing:.14em; margin:14px 2px 10px; }
  .chip-row { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    display:inline-flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    font-size:12.5px; font-weight:600; color:var(--txt-sub);
    padding:8px 13px; border-radius:var(--r-pill);
    border:1px solid var(--line-strong);
    background: rgba(255,255,255,.015);
    transition:color .16s var(--ease), background .16s var(--ease), border-color .16s var(--ease), transform .12s var(--ease);
  }
  .chip:hover { background:var(--surface-2); color:var(--txt-strong); border-color:var(--line-strong); }
  .chip:active { transform:scale(.97); }
  .chip .iconify { font-size:15px; }
  .chip.on {
    background: linear-gradient(180deg, var(--accent), var(--accent-strong));
    border-color: transparent; color: var(--on-accent);
    box-shadow: 0 1px 0 rgba(255,255,255,.22) inset;
  }
  .chip.on .iconify { color:var(--on-accent); }

  .label { font-size:11px; font-weight:700; color:var(--txt-faint); text-transform:uppercase; letter-spacing:.16em; margin:0 6px 15px; }
  .filter-note { display:flex; align-items:center; gap:10px; margin:-16px 6px 15px; font-size:12px; }
  .filter-note .fname { font-weight:600; color:var(--txt-sub); letter-spacing:-.005em; }
  .filter-note .fcount { color:var(--txt-dim); font-feature-settings: var(--tnum); }
  .filter-note .fclear { margin-left:auto; font-weight:600; color:var(--accent); cursor:pointer; letter-spacing:-.005em; }
  .filter-note .fclear:hover { color:var(--accent-strong); }

  /* ---- clip card ---- */
  #feedList {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
  }
  .clip {
    background: transparent;
    border-radius: 0;
    padding: 13px 14px; margin-bottom: 0;
    box-shadow: none;
    cursor:pointer; display:none; align-items:center; gap:12px;
    position:relative;
    transition: background .18s var(--ease);
    border-bottom: 1px solid var(--line);
  }
  .clip:last-child { border-bottom: none; }
  .clip.vis { display:flex; }
  .clip:hover { transform:none; background: rgba(255,255,255,.025); box-shadow:none; }
  .clip:active { transform:none; background: rgba(255,255,255,.04); }
  .tile {
    width:40px; height:40px; border-radius:12px; flex:0 0 auto;
    background: var(--surface-2);
    border: none;
    display:grid; place-items:center;
    position:relative;
  }

  /* ---- long-press context menu ---- */
  .backdrop {
    position:fixed; inset:0; z-index:80; opacity:0; pointer-events:none;
    background: rgba(4,5,8,.55);

  .ctx {
    position:fixed; z-index:90; min-width:236px; max-width:280px;

  @keyframes ctxPop {

  .ctx.hide { animation: ctxOut .2s var(--ease) both; }

  .ctx-item {

  .clip.pinned { box-shadow: none; }

  .copied {

  /* ---- clip detail sheet ---- */
  .detail-scrim {

  .detail-head { display:flex; align-items:center; gap:14px; margin-top:8px; }

  .detail-title { font-size:18px; font-weight:760; letter-spacing:-.024em; color:var(--txt-strong); line-height:1.28; text-wrap:balance; }

  .detail-content-preview.is-empty { color:var(--txt-faint); font-style:italic; }  /* meta grid Ã¢â‚¬â€ time copied / source / url */
  .detail-meta {

  /* description */

  /* tags */
  .detail-tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:18px; }
  /* actions Ã¢â‚¬â€ Copy / Open, plus quiet pin + favorite */
  .detail-actions { display:flex; align-items:stretch; gap:10px; margin-top:24px; padding-top:2px; }

  .detail-preview { position:relative; min-height:116px; margin-top:12px; overflow:hidden; border:1px solid var(--line-strong); border-radius:17px; background:var(--surface-2); }

  .detail-source-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:11px; color:var(--txt-dim); font-size:11px; }

  .capture.mode-clipper .filter-ph { display:none !important; }
  .capture.mode-search .capture-row { grid-template-columns:minmax(0,1fr) auto 32px 38px; grid-template-areas:"hint paste clear mode"; }
  .capture.mode-search .search-clear { grid-area:clear; display:inline-flex; }
  .capture.mode-search .filter-ph { grid-area:paste; }
  .handed-left .capture.mode-search .capture-row { grid-template-columns:38px 32px auto minmax(0,1fr); grid-template-areas:"mode clear paste hint"; }
  #screen-home.vault-mode .filter-ph { display:none !important; }
  .vault-hero { min-height:62px; margin-bottom:12px !important; padding:10px 14px; border-radius:17px; }
  #screen-home.folders-mode + * { }
  @media (max-width:360px) { .folder-card { min-height:145px; padding:12px; } .folder-card-copy strong { font-size:13px; } }

  /* Final dark-theme pass for shared elevated surfaces. Keep these after the
     view-specific rules so later light-mode composition styles cannot leak in. */
  [data-theme="dark"] .collection-confirm-card,
  [data-theme="dark"] .vault-nav {
    box-shadow:0 22px 42px -18px rgba(0,0,0,.72),0 7px 16px -8px rgba(0,0,0,.48),0 1px 0 rgba(255,255,255,.07) inset;
  }
  [data-theme="dark"] .folder-view,
  [data-theme="dark"] .feed-section {
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
  }
  [data-theme="dark"] #screen-home::after {
    background:linear-gradient(180deg,transparent 0%,rgba(21,25,24,.08) 30%,rgba(21,25,24,.38) 70%,rgba(21,25,24,.9) 100%);
  }


.cxroot{position:relative;min-height:100vh;display:flex;justify-content:center;overflow:hidden;background:var(--page)}
.cxroot::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(65% 35% at 0% -10%,rgba(77,145,124,.10),transparent 70%),radial-gradient(55% 35% at 100% 100%,rgba(226,189,132,.12),transparent 70%)}
.app{position:relative;z-index:1}
svg.i{display:inline-block;vertical-align:middle}
.mode-ic svg{width:20px;height:20px}
.copy svg,.icon-btn svg,.vt-btn svg,.view-toggle-btn svg{display:block}
.app{padding-bottom:40px!important}</style>
