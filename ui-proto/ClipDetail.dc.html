<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
*{box-sizing:border-box;margin:0;padding:0}
.cx{font-family:"Instrument Sans",-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;width:390px;min-height:100%;background:var(--page);color:var(--txt);position:relative;overflow:hidden}
.cx-dark{--page:#151918;--surface:#202624;--surface-2:#282F2D;--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.17);--txt:#F1F4EF;--txt-strong:#FFFFFF;--txt-sub:#BDC8C2;--txt-dim:#8C9993;--txt-faint:#69766F;--accent:#77C8AD;--accent-strong:#58AF92;--accent-soft:rgba(119,200,173,.13);--accent-glow:rgba(88,175,146,.30);--on-accent:#10251E}
.cx-light{--page:#F3F2ED;--surface:#FFFEFA;--surface-2:#EEEEE8;--line:rgba(22,27,29,.09);--line-strong:rgba(22,27,29,.16);--txt:#202629;--txt-strong:#111719;--txt-sub:#596366;--txt-dim:#858E90;--txt-faint:#AAB1B0;--accent:#287D6B;--accent-strong:#176454;--accent-soft:rgba(40,125,107,.11);--accent-glow:rgba(40,125,107,.20);--on-accent:#FFFFFF}
svg{display:block}
.bg{position:absolute;inset:0;padding:22px 18px;filter:blur(1px);opacity:.5}
.bg .label{font-size:11px;font-weight:700;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.16em;margin:0 4px 13px}
.bg .row{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:9px}
.bg .tile{width:40px;height:40px;border-radius:12px;background:var(--surface-2);flex:0 0 auto}
.bg .ln{height:11px;border-radius:6px;background:var(--surface-2)}
.scrim{position:absolute;inset:0;z-index:2;background:rgba(4,5,8,.55)}
.sheet{position:absolute;left:12px;right:12px;bottom:14px;z-index:3;border-radius:24px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:0 -24px 60px -12px rgba(0,0,0,.55);overflow:hidden}
.grab{width:38px;height:4px;border-radius:999px;background:var(--line-strong);margin:12px auto 0}
.sheet-in{padding:8px 18px 20px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.kicker{font-size:10.5px;font-weight:700;color:var(--txt-faint);text-transform:uppercase;letter-spacing:.16em}
.sheet-close{width:36px;height:36px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--txt-sub);display:grid;place-items:center}
.preview{position:relative;min-height:120px;margin-top:12px;border-radius:17px;overflow:hidden;border:1px solid var(--line-strong)}
.preview::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#3a1220,#c0303a 52%,#f0a08c)}
.preview-brand{position:absolute;left:16px;top:15px;z-index:1;display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.92);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.preview-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.32);color:#fff;background:rgba(15,35,31,.28)}
.preview-kind{position:absolute;right:15px;bottom:13px;z-index:1;color:rgba(255,255,255,.85);font-size:10px;font-weight:600}
.sheet-catch{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;margin:16px 0 5px}
.sheet-title{font-size:18px;font-weight:760;letter-spacing:-.024em;color:var(--txt-strong);line-height:1.28}
.sheet-srcrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:11px;color:var(--txt-dim)}
.sheet-src{display:flex;align-items:center;gap:7px;color:var(--accent);font-weight:700}
.clean-url{display:flex;align-items:center;gap:7px;margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;color:var(--txt-sub);background:var(--surface-2);font-size:11px}
.clean-url .i{color:var(--accent);flex:0 0 auto}
.acts{display:flex;gap:8px;margin-top:16px}
.act{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14.5px;font-weight:700;letter-spacing:-.014em;padding:13px;border-radius:15px;border:none}
.act.primary{background:linear-gradient(180deg,var(--accent),var(--accent-strong));color:var(--on-accent);box-shadow:0 1px 0 rgba(255,255,255,.28) inset,0 10px 22px -8px var(--accent-glow)}
.act.ghost{border:1px solid var(--line-strong);color:var(--txt-sub);background:var(--surface-2)}
.act.peer{flex:0 0 auto;width:52px;padding:0;border:1px solid var(--line-strong);color:var(--txt-sub);background:var(--surface-2)}
a{color:var(--accent)}a:hover{color:var(--accent-strong)}
  </style>
</helmet>

<div class="cx {{themeClass}}">

  <div class="bg">
    <div class="label">All clips</div>
    <div class="row"><div class="tile"></div><div style="flex:1"><div class="ln" style="width:80%"></div><div class="ln" style="width:40%;margin-top:8px"></div></div></div>
    <div class="row"><div class="tile"></div><div style="flex:1"><div class="ln" style="width:65%"></div><div class="ln" style="width:35%;margin-top:8px"></div></div></div>
    <div class="row"><div class="tile"></div><div style="flex:1"><div class="ln" style="width:72%"></div><div class="ln" style="width:30%;margin-top:8px"></div></div></div>
  </div>

  <div class="scrim"></div>

  <div class="sheet">
    <div class="grab"></div>
    <div class="sheet-in">
      <div class="sheet-top">
        <span class="kicker">Link preview</span>
        <span class="sheet-close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
      </div>

      <div class="preview">
        <div class="preview-brand"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.2-1.4-.8-2c-.75-.8-1.6-.8-2-.85C16 4.2 12 4.2 12 4.2s-4 0-6.8.2c-.4.05-1.25.05-2 .85-.6.6-.8 2-.8 2S2.2 8.8 2.2 10.5v1.6c0 1.65.2 3.3.2 3.3s.2 1.4.8 2c.75.8 1.75.77 2.2.86 1.6.15 6.6.2 6.6.2s4 0 6.8-.21c.4-.05 1.25-.05 2-.85.6-.6.8-2 .8-2s.2-1.65.2-3.3v-1.6c0-1.65-.2-3.3-.2-3.3ZM9.9 13.9V8.6l5.15 2.66Z"/></svg>YouTube</div>
        <div class="preview-play"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M8 5v14l11-7z"/></svg></div>
        <span class="preview-kind">Video · 14:22</span>
      </div>

      <div class="sheet-catch">YouTube</div>
      <div class="sheet-title">Why local-first software is eating the internet</div>

      <div class="sheet-srcrow">
        <span class="sheet-src"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>youtube.com</span>
        <span>Copied 2 min ago</span>
      </div>

      <div class="clean-url"><span class="i"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></svg></span><span>youtube.com/watch?v=localfirst01</span></div>

      <div class="acts">
        <button class="act primary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Copy</button>
        <button class="act ghost"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>Open</button>
        <button class="act peer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg></button>
        <button class="act peer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button>
      </div>
    </div>
  </div>

</div>

<script data-dc-script data-props='{"theme":{"editor":"enum","options":["Dark","Light"],"default":"Dark"}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.theme === 'Light' ? 'cx-light' : 'cx-dark' };
  }
}
</script>
</body>
</html>
