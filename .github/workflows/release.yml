# Clipplo releases — push a tag like v0.2.0 and this builds, tests,
# and publishes a downloadable APK on the GitHub Release. No local SDK needed.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          set -e
          : "${ANDROID_HOME:?ANDROID_HOME is not set on this runner}"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sS -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build + unit tests
        run: gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=(app/build/outputs/apk/debug/*.apk)
          test -f "${APK[0]}"
          VERSION="${GITHUB_REF_NAME#v}"
          cp "${APK[0]}" "clipplo-${VERSION}.apk"
          gh release create "$GITHUB_REF_NAME" "clipplo-${VERSION}.apk" \
            --title "Clipplo $GITHUB_REF_NAME" \
            --notes "Night One test build (debug-signed).

          Install: download the APK on your phone, open it, allow install from this source.
          Debug builds show the standard unknown-developer prompt — expected.

          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
